# Stage 1: Smac 2D planning only. No controller or velocity publisher.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    costmap_update_timeout: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.25
      allow_unknown: false
      # hall.yaml is 1 cm/cell; use 5 cm search cells for open-space routing.
      downsample_costmap: true
      downsampling_factor: 5
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      update_frequency: 2.0
      publish_frequency: 1.0
      rolling_window: false
      resolution: 0.01
      track_unknown_space: true
      # 0.668 m square body: circumscribed radius 0.472 m, plus margin.
      robot_radius: 0.48
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.1
          obstacle_max_range: 5.5
          raytrace_min_range: 0.1
          raytrace_max_range: 6.0
          inf_is_valid: true
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      always_send_full_costmap: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [planner_server]
