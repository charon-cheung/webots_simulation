# Static-map AMCL for the differential base; default start is the map origin.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 1.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.2
    alpha4: 0.15
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.1
    laser_max_range: 6.0
    max_beams: 120
    z_hit: 0.7
    z_rand: 0.25
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    min_particles: 500
    max_particles: 2500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.05
    update_min_a: 0.05
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
    - map_server
    - amcl
